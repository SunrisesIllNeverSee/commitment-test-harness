name: CI — tests & harness

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install package
        run: |
          pip install -e .

      - name: Download spaCy model
        run: |
          python -m spacy download en_core_web_sm

      - name: Run unit tests
        run: |
          pytest tests/ -q || (echo "pytest failed"; exit 1)

      - name: Run harness (generate example artifacts)
        env:
          TRANSFORMER_OFFLINE: "1"
        run: |
          # run harness in non-blocking/demo mode to generate plots
          cd src && python harness.py || echo "harness completed (non-zero exit allowed for heavy models)"

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commitment-harness-artifacts
          path: |
            src/*.png
            src/*.json || true