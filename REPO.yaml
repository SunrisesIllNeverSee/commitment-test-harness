standard:
  name: ello-repo-standard
  version: "1.0.0"
  mode: migrate

repo:
  name: commitment-test-harness
  type: experiment
  lifecycle: active
  repo_id: commitment_test_harness
  family: commitment-theory
  purpose: Commitment Test Harness — experimental test harness for the Conservation Law of Commitment. Python harness, test data, notebooks, paper sections. Preserves experimental/test provenance.

structure:
  profile: experiment
  allowed_root_dirs_extra: [data, diagrams, notebooks, paper_sections, src, tests, system-devin]
  allowed_root_files_extra: [appendix_a_extractor.md, debug_extraction.py, environment.yml, Harnesstest.ini, quick_test.py]
  document_roots: [protocol, docs, paper_sections]
  artifact_roots: [results, artifacts, data, diagrams]
  archive_roots: [archive]

naming:
  forbid_version_suffixes: true
  forbidden_suffixes: [_final, _final2, _new, _updated, _revised, _copy]

knowledge:
  okf_enabled: true
  okf_roots: [docs, .coord]
  okf_severity: warn

coordination:
  micro_enabled: true
  micro_root: .coord/micro
  macro_enabled: true
  macro_root: .coord/macro

github:
  ruleset_profile: solo-fast
  required_check: repo-standard
